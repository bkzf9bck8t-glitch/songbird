<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宋鳥的一天（階段 1）</title>
<style>
:root{--bg:#f1e8dc;--ink:#2b2230;--box:#fff9ec;--line:#7a5a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1722;--ink:#f0e6d8;--line:#c9a77a}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#wrap{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px}
#hud{font-size:14px;min-height:20px;text-align:center;opacity:0;transition:opacity .6s}
#stage{position:relative;width:100%;aspect-ratio:176/208;background:#000;border-radius:10px;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--box);color:#2b2230;border:3px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.5;display:none}
#dlg small{display:block;text-align:right;opacity:.5;font-size:12px}
#intro{position:absolute;inset:0;background:#000;color:#f6e7c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity 2.2s;cursor:pointer}
#intro h1{font-size:30px;margin:0;letter-spacing:.15em}
#intro p{margin:0;font-size:15px;opacity:.7}
#note{font-size:12px;text-align:center;opacity:.65}
</style></head><body>
<div id="wrap">
<div id="hud">主線任務：尋找你的生日禮物</div>
<div id="stage">
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="dlg"></div>
<div id="intro"><h1>宋鳥的一天</h1><p>點一下開始</p></div>
</div>
<div id="note">階段 1 測試版：臥室、衣帽間、陽台已照真實格局。美術仍是暫時方塊。</div>
</div>
<script>
const T=16,C=11,R=13,W=C*T,H=R*T;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
const BAGS=['一些包包。','我對它們沒有印象。'];
const ROOMS={
bed:{wl:2,floor:['#efe3cf','#e9dcc5'],wall:'#e9e2d3',wallL:'#d8cfbc',base:'#b9a07a',
 objs:[
 {id:'head',x:4,y:0,w:4,h:2,bg:1,kind:'head',text:['床頭櫃體。','上面擺滿瓶瓶罐罐，沒有燈。']},
 {x:8,y:0,w:3,h:2,bg:1,kind:'ac',text:['冷氣。','冷氣開著。']},
 {x:10,y:2,w:1,h:7,bg:1,kind:'rwin'},
 {x:5,y:12,w:3,h:1,hgt:6,top:'#3d4a5f',front:'#1c1c24',solid:1,text:['電視。','來看一下哲哲好了。……不對，先找禮物。']},
 {x:4,y:2,w:4,h:1,hgt:16,top:'#d6b98c',front:'#c19a6b',solid:1,text:['床頭櫃體。','上面擺滿瓶瓶罐罐，沒有燈。']},
 {x:8,y:2,w:2,h:1,hgt:16,top:'#d6b98c',front:'#c19a6b',solid:1,text:['床邊的木櫃。','跟床頭櫃連在一起，一路延伸到窗邊。']},
 {id:'bed',x:4,y:3,w:4,h:5,hgt:8,kind:'bed',top:'#8fb0d6',front:'#d2b48a',solid:1,text:['藍色雙人床。','睡得很好，謝謝。']},
 {x:6,y:3,w:1,h:1,hgt:8,lift:80,kind:'plush',appr:'bed',text:['傑斯維爾。紅色的身體，一臉呆樣。','它看起來比我還想睡。']},
 {x:2,y:2,w:2,h:1,hgt:16,kind:'dresser',top:'#d9bd90',front:'#b8935f',solid:1,text:['梳妝台。','鏡子裡的我，頭髮像鳥巢。']},
 {x:2,y:3,w:1,h:1,hgt:5,top:'#3d4a5c',front:'#2b3442',solid:1,text:['深色梳妝椅。','沒有人坐，但它看起來很有自信。']},
 {x:10,y:4,w:1,h:1,hgt:30,kind:'fan',solid:1,text:['電風扇。','轉頭的角度永遠對不到我。']}],
 exits:[{x:10,y:12,to:'balcony',sx:3,sy:3},
        {x:2,y:4,wall:'L',to:'closet',sx:5,sy:11},{x:2,y:5,wall:'L',to:'closet',sx:5,sy:11},
        {x:2,y:12,wall:'L',say:['通往客廳的木門。','客廳還在施工中。（階段 1 只做臥室、衣帽間、陽台）']}]},
closet:{wl:0,floor:['#e4d6bd','#ddcfb4'],wall:'#e2dccd',base:'#b9a07a',
 objs:[
 {x:4,y:0,w:3,h:2,bg:1,kind:'window',plain:1,text:['窗戶。','外面是別人家的晾衣架。']},
 {x:0,y:2,w:3,h:11,void:1,solid:1,bg:1},{x:8,y:2,w:3,h:11,void:1,solid:1,bg:1},
 {x:3,y:3,w:1,h:8,hgt:22,kind:'rack',top:'#c9ae86',solid:1,text:['吊掛的衣服和抽屜。','這麼多，我平常到底穿哪幾件？']},
 {x:7,y:3,w:1,h:8,hgt:22,kind:'rack',top:'#c9ae86',solid:1,text:['吊掛的衣服和抽屜。','這麼多，我平常到底穿哪幾件？']},
 {x:4,y:2,w:3,h:1,hgt:10,kind:'shelf',top:'#cdb48f',front:'#a98763',solid:1,text:['盡頭的架子。','上面有一個彩色的袋子，掛著一隻黑貓。']}],
 exits:[{x:4,y:12,to:'bed',sx:3,sy:4},{x:5,y:12,to:'bed',sx:3,sy:4},{x:6,y:12,to:'bed',sx:3,sy:4}]},
balcony:{wl:2,floor:['#ece6dc','#e4ddd0'],wall:'#c49a82',wallL:'#b58a74',base:'#a37c66',
 objs:[
 {x:2,y:6,w:9,h:7,void:1,solid:1,bg:1},{x:3,y:5,w:7,h:1,hgt:14,top:'#c9a06c',front:'#a97c4c',solid:1,text:['長木櫃。','裡面大概是洗衣精和一堆用不到的東西。']},
 {x:9,y:2,w:2,h:2,hgt:16,top:'#f4f4f2',front:'#dcdcdc',kind:'washer',solid:1,text:['洗衣機。','裡面是空的。']},
 {x:4,y:2,w:3,h:1,hgt:26,kind:'drying',top:'#cfd3d6',solid:1,text:['晾著的衣服。','大部分是黑色的，我的品味很一致。']},
 {x:8,y:4,w:1,h:1,hgt:6,top:'#f3e6b8',front:'#d8c88f',solid:1,text:['黃色的水桶。','不知道用來幹嘛，但它一直在這裡。']}],
 exits:[{x:2,y:3,wall:'L',to:'bed',sx:10,sy:11}]}
};
let room='bed',blocked=[],busy=true,pending=null;
const P={cx:4,cy:6,px:0,py:0,path:[],t:0,moving:false};
function setCell(x,y){P.cx=x;P.cy=y;P.px=x*T+8;P.py=y*T+14;P.path=[];}
function build(){
 const wl=ROOMS[room].wl;
 blocked=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>(y<2||x<wl)?1:0));
 ROOMS[room].objs.forEach(o=>{if(o.solid)for(let j=0;j<o.h;j++)for(let i=0;i<o.w;i++)blocked[o.y+j][o.x+i]=1;});
}
function bfs(sx,sy){
 const d=Array.from({length:R},()=>Array(C).fill(-1)),pr={};d[sy][sx]=0;const q=[[sx,sy]];
 for(let k=0;k<q.length;k++){const[x,y]=q[k];
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
   if(nx<0||ny<0||nx>=C||ny>=R||blocked[ny][nx]||d[ny][nx]>=0)continue;
   d[ny][nx]=d[y][x]+1;pr[nx+','+ny]=[x,y];q.push([nx,ny]);}}
 return{d,pr};
}
function route(sx,sy,tx,ty){
 const{d,pr}=bfs(sx,sy);if(d[ty][tx]<0)return null;
 const p=[];let c=[tx,ty];while(c[0]!==sx||c[1]!==sy){p.unshift(c);c=pr[c[0]+','+c[1]];}return p;
}
let lines=[],after=null;
function say(ls,cb){lines=ls.slice();after=cb||null;busy=true;next();}
function next(){
 const d=$('dlg');
 if(!lines.length){d.style.display='none';busy=false;const a=after;after=null;if(a)a();return;}
 d.style.display='block';d.innerHTML=lines.shift()+'<small>▼</small>';
}
$('dlg').addEventListener('pointerdown',e=>{e.stopPropagation();next();});
cv.addEventListener('pointerdown',e=>{
 if(busy)return;
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 const R0=ROOMS[room],objs=R0.objs,wl=R0.wl;
 const origin=P.path.length?P.path[0]:[P.cx,P.cy],lead=P.path.length?[P.path[0]]:[];
 const go=(p,act)=>{if(!p)return;P.path=lead.concat(p);pending=act;if(!P.path.length)arrive();};
 let cx=Math.floor(x/T),cy=Math.floor(y/T);if(cx<0||cy<0||cx>=C||cy>=R)return;
 let ecx=cx,ecy=cy;if(cx<wl&&cy>=2)ecx=wl;if(cy<2&&cx>=wl)ecy=2;
 const ex=R0.exits.find(q=>q.x===ecx&&q.y===ecy);
 if(ex){go(route(origin[0],origin[1],ex.x,ex.y),{exit:ex});return;}
 for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.void||!o.text)continue;
  if(x>=o.x*T&&x<(o.x+o.w)*T&&y>=o.y*T-(o.hgt||0)&&y<(o.y+o.h)*T){
   const a=o.appr?objs.find(q=>q.id===o.appr):o;
   const{d}=bfs(origin[0],origin[1]);let best=null;
   for(let j=-1;j<=a.h;j++)for(let k=-1;k<=a.w;k++){
    if((j>=0&&j<a.h)&&(k>=0&&k<a.w))continue;if((j<0||j>=a.h)&&(k<0||k>=a.w))continue;
    const nx=a.x+k,ny=a.y+j;if(nx<0||ny<0||nx>=C||ny>=R||blocked[ny][nx]||d[ny][nx]<0)continue;
    if(!best||d[ny][nx]<best.d)best={d:d[ny][nx],nx,ny};}
   if(best)go(route(origin[0],origin[1],best.nx,best.ny),{talk:o.text});
   return;}}
 if(!blocked[cy][cx])go(route(origin[0],origin[1],cx,cy),null);
});
function arrive(){
 const a=pending;pending=null;if(!a)return;
 if(a.talk)say(a.talk);
 else if(a.exit){const e=a.exit;
  if(e.to){busy=true;$('fade').style.opacity=1;setTimeout(()=>{room=e.to;build();setCell(e.sx,e.sy);$('fade').style.opacity=0;setTimeout(()=>busy=false,300);},320);}
  else say(e.say,()=>{P.path=[[P.cx,P.cy-1]];});}
}
function shade(c,f){const n=parseInt(c.slice(1),16);return`rgb(${Math.max(0,(n>>16)*f)|0},${Math.max(0,((n>>8)&255)*f)|0},${Math.max(0,(n&255)*f)|0})`;}
function box(o){
 const x=o.x*T,y=o.y*T-o.hgt,w=o.w*T,h=o.h*T,fy=(o.y+o.h)*T-o.hgt;
 ctx.fillStyle='rgba(60,40,20,.22)';ctx.fillRect(x+2,(o.y+o.h)*T-2,w,3);
 ctx.fillStyle=o.top;ctx.fillRect(x,y,w,h);
 if(o.kind==='rack'){const cols=['#c25a5a','#2e2e36','#e8dfc8','#5b8fb9','#2e2e36','#d98aa6','#6a9e6e','#e8dfc8'];
  for(let j=0;j<o.h;j++){ctx.fillStyle=cols[j%8];ctx.fillRect(x+2,y+j*T+2,w-4,T-4);}
  ctx.fillStyle='#a98a62';ctx.fillRect(x,fy,w,o.hgt);ctx.fillStyle='#8c6f4b';for(let j=0;j<o.h;j++)ctx.fillRect(x+2,fy+j*T+(o.hgt-6),w-4,1);}
 else{ctx.fillStyle=o.front;ctx.fillRect(x,fy,w,o.hgt);}
 ctx.strokeStyle=shade(o.front||'#a98a62',.62);ctx.strokeRect(x+.5,y+.5,w-1,h+o.hgt-1);
 if(o.kind==='bed'){
  ctx.fillStyle='#c8e06a';ctx.fillRect(x+3,y+3,22,10);ctx.fillStyle='#58c79a';ctx.fillRect(x+30,y+3,22,10);
  ctx.fillStyle='#d9c8a0';ctx.fillRect(x+8,y+26,46,30);ctx.fillRect(x+4,y+32,54,18);ctx.fillStyle='#c4b288';ctx.fillRect(x+12,y+34,18,3);ctx.fillRect(x+30,y+44,18,3);}
 if(o.kind==='dresser'){const c=['#e07a8c','#7fb069','#f2f2f2','#9b7fc7','#f0c14b','#5aa9c9'];
  for(let k=0;k<5;k++){ctx.fillStyle=c[k%6];ctx.fillRect(x+3+k*6,y+4,4,7);}}
 if(o.kind==='shelf'){ctx.fillStyle='#2b2230';ctx.fillRect(x+T+4,y-2,9,6);
  ['#d6453d','#f0b429','#3fa86b','#3b82c4','#9b59b6'].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(x+T+3+i*2,y+4,2,9);});}
}
function plush(o){const x=o.x*T+4,y=o.y*T-o.hgt-2;
 ctx.fillStyle='#d6453d';ctx.fillRect(x,y+5,8,9);ctx.fillRect(x-2,y+6,2,6);ctx.fillRect(x+8,y+6,2,6);
 ctx.fillStyle='#f0dcae';ctx.fillRect(x,y,8,5);ctx.fillStyle='#2b2230';ctx.fillRect(x+1,y+2,2,1);ctx.fillRect(x+5,y+2,2,1);ctx.fillRect(x+2,y+4,4,1);}
function fan(o){const x=o.x*T,b=(o.y+1)*T;
 ctx.fillStyle='rgba(60,40,20,.22)';ctx.fillRect(x+2,b-2,12,3);
 ctx.fillStyle='#e8e8e8';ctx.fillRect(x+3,b-3,10,3);ctx.fillRect(x+7,b-20,2,17);
 ctx.fillStyle='#fafafa';ctx.fillRect(x+1,b-34,14,14);ctx.fillStyle='#c5ccd3';ctx.fillRect(x+3,b-32,10,10);ctx.fillStyle='#fafafa';ctx.fillRect(x+7,b-32,2,10);ctx.fillRect(x+3,b-28,10,2);}
function washer(o){box(o);const x=o.x*T,y=o.y*T-o.hgt;ctx.fillStyle='#2f3a44';ctx.fillRect(x+7,y+h2(o)-18,14,14);ctx.fillStyle='#8aa6b8';ctx.fillRect(x+10,y+h2(o)-15,8,8);}
function h2(o){return o.h*T+o.hgt;}
function drying(o){const x=o.x*T,y=o.y*T-o.hgt;ctx.fillStyle='#cfd3d6';ctx.fillRect(x,y,o.w*T,3);
 ctx.fillStyle='#2e2e36';ctx.fillRect(x+4,y+3,9,20);ctx.fillStyle='#8d8f96';ctx.fillRect(x+16,y+3,8,16);ctx.fillStyle='#2a2a33';ctx.fillRect(x+25,y+3,6,22);
 ctx.fillStyle='rgba(60,40,20,.22)';ctx.fillRect(x+2,(o.y+o.h)*T-2,o.w*T,3);}
function playerDraw(){
 const b=P.moving?Math.abs(Math.sin(P.t*10))*1.5:0,x=Math.round(P.px),y=Math.round(P.py-18-b);
 ctx.fillStyle='rgba(60,40,20,.28)';ctx.fillRect(x-5,P.py-1,10,3);
 ctx.fillStyle='#2b1d17';ctx.fillRect(x-5,y,10,5);ctx.fillRect(x-6,y+1,2,4);ctx.fillRect(x+4,y+1,2,4);ctx.fillRect(x-3,y-2,2,2);ctx.fillRect(x+1,y-3,2,3);
 ctx.fillStyle='#f1c9a5';ctx.fillRect(x-4,y+4,8,5);
 ctx.fillStyle='#c9ced6';ctx.fillRect(x-4,y+5,3,3);ctx.fillRect(x+1,y+5,3,3);ctx.fillStyle='#2b2230';ctx.fillRect(x-3,y+6,1,1);ctx.fillRect(x+2,y+6,1,1);
 ctx.fillStyle='#2a2a33';ctx.fillRect(x-5,y+9,10,7);ctx.fillStyle='#f1c9a5';ctx.fillRect(x-6,y+11,1,3);ctx.fillRect(x+5,y+11,1,3);
 const s=P.moving&&Math.sin(P.t*10)>0?1:0;ctx.fillStyle='#3a4a6a';ctx.fillRect(x-4,y+16,3,2-s);ctx.fillRect(x+1,y+16,3,1+s);
}
function bgObj(o){
 const x=o.x*T,y=o.y*T,w=o.w*T,h=o.h*T;
 if(o.void){ctx.fillStyle='#2a2130';ctx.fillRect(x,y,w,h);}
 else if(o.kind==='tv'){ctx.fillStyle='#c9a06c';ctx.fillRect(2,y+2,T*2-4,h-4);ctx.fillStyle='#1c1c24';ctx.fillRect(6,y+7,T*2-12,h-14);ctx.fillStyle='#3d4a5f';ctx.fillRect(8,y+9,T*2-16,h-18);}
 else if(o.kind==='head'){ctx.fillStyle='#d6b98c';ctx.fillRect(x,1,w,2*T-1);ctx.fillStyle='#f1ead9';ctx.fillRect(x+4,3,w-8,15);ctx.fillStyle='#b8935f';ctx.fillRect(x+3,20,w-6,2);
  ['#e07a8c','#f2f2f2','#7fb069','#f2f2f2','#5aa9c9'].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(x+7+i*9,23,4,6);});}
 else if(o.kind==='ac'){ctx.fillStyle='#f2f2f2';ctx.fillRect(x+4,4,w-8,8);ctx.fillStyle='#d4d4d4';ctx.fillRect(x+4,11,w-8,1);}
 else if(o.kind==='rwin'){ctx.fillStyle='#b9a07a';ctx.fillRect(x+T-6,y,6,h);ctx.fillStyle='#a9d3e6';ctx.fillRect(x+T-5,y+6,4,h-12);ctx.fillStyle='#e8c3b8';ctx.fillRect(x+T-5,y+1,4,6);ctx.fillRect(x+T-5,y+h-7,4,6);}
 else if(o.kind==='window'){ctx.fillStyle='#b9a07a';ctx.fillRect(x,2,w,2*T-4);ctx.fillStyle='#a9d3e6';ctx.fillRect(x+2,4,w-4,2*T-8);
  if(!o.plain){ctx.fillStyle='#e8c3b8';ctx.fillRect(x+2,4,6,2*T-8);ctx.fillRect(x+w-8,4,6,2*T-8);}
  if(o.ac){ctx.fillStyle='#f2f2f2';ctx.fillRect(x-12,0,w+10,6);}}
}
function exitDraw(e,wl){
 const c=e.col||'#b98550';ctx.fillStyle=c;
 if(e.wall==='L'){ctx.fillRect(3,e.y*T+1,wl*T-6,T-1);ctx.fillStyle=shade(c,.7);ctx.fillRect(3,e.y*T,wl*T-6,1);ctx.fillStyle='#e8cf8f';ctx.fillRect(wl*T-9,e.y*T+7,2,2);}
 else if(e.wall==='T'){ctx.fillRect(e.x*T+1,3,T-2,2*T-5);ctx.fillStyle=shade(c,.7);ctx.fillRect(e.x*T,3,1,2*T-5);}
 else{ctx.fillStyle='#b98550';ctx.fillRect(e.x*T,e.y*T,T,T);ctx.fillStyle='#8a6035';ctx.fillRect(e.x*T+2,e.y*T+2,T-4,T-4);ctx.fillStyle='#e8cf8f';ctx.fillRect(e.x*T+T-5,e.y*T+7,2,2);}
}
function draw(){
 const R0=ROOMS[room],wl=R0.wl;
 ctx.fillStyle=R0.wall;ctx.fillRect(0,0,W,2*T);
 if(wl){ctx.fillStyle=R0.wallL;ctx.fillRect(0,0,wl*T,H);ctx.fillStyle=R0.base;ctx.fillRect(wl*T-3,2*T,3,H);}
 ctx.fillStyle=R0.base;ctx.fillRect(wl*T,2*T-3,W,3);
 for(let y=2;y<R;y++)for(let x=wl;x<C;x++){ctx.fillStyle=R0.floor[(x+y)%2];ctx.fillRect(x*T,y*T,T,T);}
 R0.objs.forEach(o=>{if(o.bg)bgObj(o);});
 R0.exits.forEach(e=>exitDraw(e,wl));
 const items=R0.objs.filter(o=>!o.bg).map(o=>({s:(o.y+o.h)*T+(o.lift||0),f:()=>o.kind==='plush'?plush(o):o.kind==='fan'?fan(o):o.kind==='washer'?washer(o):o.kind==='drying'?drying(o):box(o)}));
 items.push({s:P.py,f:playerDraw});items.sort((a,b)=>a.s-b.s).forEach(i=>i.f());
 const g=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,170);g.addColorStop(0,'rgba(255,214,150,0)');g.addColorStop(1,'rgba(40,20,50,.28)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
let last=0;
function loop(t){
 const dt=Math.min(.05,(t-last)/1000||0);last=t;P.moving=false;
 if(P.path.length){const[nx,ny]=P.path[0],tx=nx*T+8,ty=ny*T+14,dx=tx-P.px,dy=ty-P.py,dist=Math.hypot(dx,dy),st=58*dt;P.moving=true;P.t+=dt;
  if(dist<=st){P.px=tx;P.py=ty;P.cx=nx;P.cy=ny;P.path.shift();if(!P.path.length){P.moving=false;arrive();}}
  else{P.px+=dx/dist*st;P.py+=dy/dist*st;}}
 draw();requestAnimationFrame(loop);
}
function alarm(){try{const a=new(window.AudioContext||window.webkitAudioContext)();
 for(let i=0;i<6;i++){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=i%2?740:880;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.28);o.stop(a.currentTime+i*.28+.14);}}catch(e){}}
$('intro').addEventListener('pointerdown',()=>{
 alarm();$('intro').style.pointerEvents='none';$('intro').style.opacity=0;
 setTimeout(()=>{$('intro').style.display='none';
  say(['……（鬧鐘聲）','今天是我的生日。','禮物應該就在這個家裡某個地方。'],()=>{$('hud').style.opacity=1;});},2300);
},{once:true});
build();setCell(8,6);requestAnimationFrame(loop);
