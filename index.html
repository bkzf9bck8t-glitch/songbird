</style></head><body><div id="app"><div class="top"><div><strong>宋鳥的一天</strong><div class="tag">第一幕｜今天是我的生日</div></div><button class="btn" id="reset">重新開始</button></div><div class="hud"><span class="pill" id="room">臥室</span><span class="pill" id="goal">🎁 尋找你的生日禮物</span><span class="pill" id="tissues">🧻 0 / 5</span></div><canvas id="game" width="384" height="288"></canvas><div class="help">點擊地板自動移動｜點擊家具自動靠近調查｜點擊綠色門口換房間</div><div class="controls"><div class="dpad"><span></span><button class="move" data-dir="up">▲</button><span></span><button class="move" data-dir="left">◀</button><span></span><button class="move" data-dir="right">▶</button><span></span><button class="move" data-dir="down">▼</button><span></span></div><button class="act" id="action">調查</button></div><div class="utility"><button class="btn" id="book">📓 線索筆記</button><button class="btn" id="task">📋 任務</button><button class="btn" id="hint">❔ 操作說明</button></div><div class="footer">手機版試玩｜進度自動儲存在此裝置瀏覽器</div></div><div class="dialog hidden" id="dialog"><div class="panel"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div class="choices" id="dialogChoices"></div></div></div><div class="notebook hidden" id="notebook"><div class="book"><h2>📓 宋鳥的線索筆記</h2><p class="small">只有值得留意的生活細節才會記在這裡。試著把兩條線索連在一起。</p><div id="clueList"></div><h3>連結線索</h3><div class="pair"><select id="clueA"></select><select id="clueB"></select></div><p><button class="btn" id="combine">嘗試推理</button></p><p id="pairResult"></p><button class="btn" id="closeBook">關閉筆記本</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const W=12,H=9,T=32;const $=id=>document.getElementById(id);const names={bedroom:'臥室',closet:'衣櫥',living:'客廳',study:'書房',kitchen:'廚房',bath:'浴室',balcony:'陽台'};const layouts={bedroom:{floor:'#9d836d',walls:'#c7b6a0',items:[['bed',2,1,3,2,'床'],['vanity',8,1,2,1,'梳妝台'],['tissueBed',7,5,1,1,'衛生紙'],['fan',9,5,1,1,'電風扇']],doors:[['closet',11,2,'衣櫥'],['living',5,8,'客廳']]},closet:{floor:'#92755c',walls:'#b7a38c',items:[['clothes',2,1,5,1,'掛著的衣服'],['bags',3,5,4,1,'包包']],doors:[['bedroom',0,2,'臥室']]},living:{floor:'#b59b7d',walls:'#d4c2a5',items:[['sofa',1,1,4,2,'格紋沙發'],['tissueSofa',4,3,1,1,'衛生紙'],['tv',8,1,3,1,'電視'],['table',5,4,2,1,'玻璃茶几'],['tea',6,4,1,1,'冰紅茶'],['shelf',9,4,2,2,'白色書櫃'],['tissueLiving',2,5,1,1,'衛生紙']],doors:[['bedroom',5,0,'臥室'],['study',11,4,'書房'],['kitchen',5,8,'廚房']]},study:{floor:'#8f8177',walls:'#b5b1a5',items:[['computers',2,1,7,2,'三台電腦'],['cards',8,5,2,1,'卡牌展示櫃'],['tissueStudy',3,5,1,1,'衛生紙']],doors:[['living',0,4,'客廳']]},kitchen:{floor:'#b6b7ac',walls:'#d8d6c9',items:[['fridge',1,1,2,2,'冰箱'],['island',5,3,4,2,'中島'],['sink',9,1,2,1,'水槽'],['trash',9,6,1,1,'垃圾桶'],['tissueKitchen',4,6,1,1,'衛生紙']],doors:[['living',5,0,'客廳'],['bath',11,4,'浴室'],['balcony',2,8,'陽台']]},bath:{floor:'#a9b9b8',walls:'#cbd7d5',items:[['brushes',2,1,3,1,'牙刷'],['mirror',7,1,2,1,'鏡子'],['shower',8,5,2,2,'淋浴間']],doors:[['kitchen',0,4,'廚房']]},balcony:{floor:'#9eada7',walls:'#b8c6c1',items:[['washer',2,2,2,2,'洗衣機'],['laundry',7,2,3,1,'晾衣區']],doors:[['kitchen',2,0,'廚房']]}};const defaultState=()=>({room:'bedroom',x:6,y:5,seen:{},clues:[],picked:[],discarded:false,teaFridge:false,chapterDone:false,paired:[],started:false});let s;try{s=Object.assign(defaultState(),JSON.parse(localStorage.getItem('songbird-act1')||'{}'))}catch{s=defaultState()}let dialogOpen=false;const save=()=>{try{localStorage.setItem('songbird-act1',JSON.stringify(s))}catch{}};function modal(title,text,options){dialogOpen=true;$('dialog').classList.remove('hidden');$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogChoices').innerHTML='';(options||[['繼續',()=>{}]]).forEach(([label,fn])=>{let b=document.createElement('button');b.className='choice';b.textContent='▸ '+label;b.onclick=()=>{closeModal();fn?.();save();draw()};$('dialogChoices').append(b)})}function closeModal(){dialogOpen=false;$('dialog').classList.add('hidden')}function clue(id,label){if(!s.clues.some(c=>c.id===id)){s.clues.push({id,label});save()}}function seen(id){s.seen[id]=true;save()}function near(obj){let [id,x,y,w,h]=obj;return s.x>=x-1&&s.x<=x+w&&s.y>=y-1&&s.y<=y+h}function blocked(x,y){return layouts[s.room].items.some(([id,a,b,w,h])=>x>=a&&x<a+w&&y>=b&&y<b+h)}function changeRoom(dest){const opposite={bedroom:{closet:[1,2],living:[5,1]},closet:{bedroom:[10,2]},living:{bedroom:[5,7],study:[1,4],kitchen:[5,1]},study:{living:[10,4]},kitchen:{living:[5,7],bath:[1,4],balcony:[2,1]},bath:{kitchen:[10,4]},balcony:{kitchen:[2,7]}};let from=s.room;s.room=dest;[s.x,s.y]=opposite[from]?.[dest]||[6,5];save();draw();if(dest==='closet'&&!s.seen.closet){seen('closet');modal('衣櫥','衣服、包包，還有一些平常不太會去動的東西。\n看起來沒有生日禮物。')}if(dest==='living'&&!s.seen.firstLiving){seen('firstLiving');modal('客廳','一切都很熟悉。\n但又好像哪裡不太對。')}}function move(dir){if(dialogOpen||!$('notebook').classList.contains('hidden'))return;const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];let x=s.x+d[0],y=s.y+d[1];if(x<0||x>=W||y<0||y>=H)return;let door=layouts[s.room].doors.find(a=>a[1]===x&&a[2]===y);if(door){changeRoom(door[0]);return}if(!blocked(x,y)){s.x=x;s.y=y;save();draw()}}function interact(){if(dialogOpen)return;let list=layouts[s.room].items.filter(near);if(!list.length){modal('宋鳥','這裡沒什麼特別的。');return}let obj=list.sort((a,b)=>Math.abs(s.x-a[1])+Math.abs(s.y-a[2])-Math.abs(s.x-b[1])-Math.abs(s.y-b[2]))[0];act(obj[0])}function pick(id){if(s.picked.includes(id))return; s.picked.push(id);let n=s.picked.length  'shower':modal('淋浴間','沒什麼值得注意的。');break;case 'washer':modal('洗衣機','陽台的洗衣機。\n今天先不要洗衣服了。');break;case 'laundry':modal('晾衣區','有些衣服正在晾乾。');break;default:modal('宋鳥','沒什麼特別的。')}}function putTea(){s.teaFridge=true;clue('tea','半杯冰紅茶');modal('冰箱','宋鳥：「反正她還要喝。」\n\n宋鳥：「……誰？」');save();draw()}function checkpoint(){save();if(s.chapterDone)return;if(s.discarded&&s.clues.length>=3){s.chapterDone=true;save();modal('第一幕｜新的疑問','你整理完散落的衛生紙，也發現家裡有些不太合理的細節。\n\n宋鳥：「……以前是不是還有別人住？」\n\n主線任務仍然是：尋找你的生日禮物。\n\n【第一幕完成】\n第二幕將從騎摩托車出門開始。')}else modal('宋鳥','房子暫時乾淨了。\n不過，總覺得還有什麼沒注意到。\n試著調查浴室、客廳和書房，再打開線索筆記本。')}function notebook(){const el=$('notebook');el.classList.remove('hidden');$('clueList').innerHTML=s.clues.length?s.clues.map(c=>'<div class="clue">🔎 '+c.label+'</div>').join(''):'<p>目前還沒有記下線索。試著調查家裡。</p>';for(const id of ['clueA','clueB'])$(id).innerHTML='<option value="">選擇線索</option>'+s.clues.map(c=>'<option value="'+c.id+'">'+c.label+'</option>').join('');$('pairResult').textContent='';}function combine(){let a=$('clueA').value,b=$('clueB').value;if(!a||!b||a===b){$('pairResult').textContent='請選兩條不同的線索。';return}let k=[a,b].sort().join('+'),answers={'brushes+computers':'牙刷和電腦都多出一份。這個家以前是不是還有別人住？','sofa+tea':'總是留著沙發右邊的位置，還習慣替別人收飲料……這到底是誰的習慣？'};if(answers[k]){s.paired=s.paired||[];if(!s.paired.includes(k))s.paired.push(k);$('pairResult').textContent='💡 '+answers[k];save();if(s.discarded&&s.clues.length>=3&&!s.chapterDone){setTimeout(()=>{elClose();checkpoint()},1100)}}else $('pairResult').textContent='宋鳥：「……硬要說有關係，好像也沒有。」';}function elClose(){$('notebook').classList.add('hidden')}function draw(){let L=layouts[s.room];ctx.fillStyle=L.floor;ctx.fillRect(0,0,384,288);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.strokeStyle='#00000012';ctx.strokeRect(x*T,y*T,T,T);if((x+y)%7===0){ctx.fillStyle='#ffffff0c';ctx.fillRect(x*T+4,y*T+5,3,3)}}ctx.fillStyle=L.walls;ctx.fillRect(0,0,384,8);ctx.fillRect(0,280,384,8);ctx.fillRect(0,0,8,288);ctx.fillRect(376,0,8,288);L.doors.forEach(([dest,x,y])=>{ctx.fillStyle='#4d8d82';ctx.fillRect(x*T+3,y*T+3,26,26);ctx.fillStyle='#e4f0cb';ctx.fillRect(x*T+12,y*T+9,8,14);ctx.fillStyle='#172c32';ctx.font='9px sans-serif';ctx.fillText('↗',x*T+12,y*T+28)});const palette={bed:'#52799e',vanity:'#b08b77',fan:'#8b9cb0',clothes:'#9e6880',bags:'#735a53',sofa:'#837e91',tv:'#343c50',table:'#b7d6d2',tea:'#a44f4c',shelf:'#eee5d5',computers:'#5d6983',cards:'#b7a58b',fridge:'#f0ede4',island:'#a38b79',sink:'#b8c9d1',trash:'#4d6973',brushes:'#e9dfd3',mirror:'#a5c9d1',shower:'#a7c4cb',washer:'#ecece2',laundry:'#bca8a1'};L.items.forEach(([id,x,y,w,h,label])=>{if(id.startsWith('tissue')&&s.picked.includes(id))return;let px=x*T+3,py=y*T+3,ww=w*T-6,hh=h*T-6;ctx.fillStyle='#00000040';ctx.fillRect(px+3,py+4,ww,hh);ctx.fillStyle=id.startsWith('tissue')?'#f8f4e7':palette[id]||'#a8a1a1';ctx.fillRect(px,py,ww,hh);ctx.fillStyle='#ffffff40';ctx.fillRect(px+3,py+3,Math.max(ww-6,2),4);ctx.fillStyle=id==='tv'||id==='computers'?'#d6f3e7':'#292c38';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(id.startsWith('tissue')?'🧻':label,px+ww/2,py+hh/2+4,Math.max(ww-3,25));ctx.textAlign='left'});let px=s.x*T+8,py=s.y*T+3;ctx.fillStyle='#00000055';ctx.fillRect(px+1,py+24,17,5);ctx.fillStyle='#252b36';ctx.fillRect(px+3,py+2,16,10);ctx.fillStyle='#f0c2a4';ctx.fillRect(px+5,py+11,13,9);ctx.fillStyle='#a2b4d1';ctx.fillRect(px+4,py+20,15,8);ctx.fillStyle='#303b54';ctx.fillRect(px+5,py+27,5,4);ctx.fillRect(px+14,py+27,5,4);ctx.fillStyle='#e9eef0';ctx.fillRect(px+6,py+13,5,3);ctx.fillRect(px+13,py+13,5,3);ctx.fillStyle='#313844';ctx.fillRect(px+10,py+14,3,2);ctx.fillStyle='#f1d89a';ctx.fillRect(px+8,py-3,5,3);$('room').textContent='📍 '+names[s.room];$('tissues').textContent='🧻 '+s.picked.length+' / 5'+(s.discarded?' ✓':'');$('goal').textContent=s.chapterDone?'🎁 第一幕完成':'🎁 尋找你的生日禮物'}document.querySelectorAll('[data-dir]').forEach(b=>{let timer=null;let run=()=>move(b.dataset.dir);b.addEventListener('pointerdown',e=>{e.preventDefault();run();timer=setInterval(run,155)}); let walkTimer=null;function stopWalk(){if(walkTimer!==null){clearInterval(walkTimer);walkTimer=null}}
function route(tx,ty,adjacent){let q=[[s.x,s.y]], seen=new Set([s.x+','+s.y]),prev=new Map(),end=null;
